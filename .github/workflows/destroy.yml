name: destroy
on:
  workflow_dispatch:
    inputs:
      environment: { type: choice, options: [dev, homolog, prod] }
      confirm:     { type: string, description: "digite DESTRUIR-<ambiente>" }

permissions:
  id-token: write
  contents: read

jobs:
  destroy:
    runs-on: ubuntu-latest
    environment: destroy   # exige aprovação de um revisor
    env:
      ENVIRONMENT: ${{ inputs.environment }}
      CONFIRM: ${{ inputs.confirm }}
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_IN_AUTOMATION: "true"
      TF_VAR_environment: ${{ inputs.environment }}
      TF_VAR_location: ${{ inputs.environment == 'homolog' && vars.AZURE_LOCATION_HOMOLOG || vars.AZURE_LOCATION }}
      TF_VAR_ssh_public_key: ${{ vars.SSH_PUBLIC_KEY }}
    steps:
      - name: Conferir confirmação
        run: |
          [ "$CONFIRM" = "DESTRUIR-$ENVIRONMENT" ] || { echo "::error::confirmação inválida"; exit 1; }

      - uses: actions/checkout@v4

      - uses: ./.github/actions/connect
        id: conn
        with:
          environment: ${{ env.ENVIRONMENT }}
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          tfstate-rg: ${{ vars.TFSTATE_RG }}
          tfstate-sa: ${{ vars.TFSTATE_SA }}
          tfstate-container: ${{ vars.TFSTATE_CONTAINER }}

      - name: Backup final para o Blob
        working-directory: ansible
        run: |
          ansible-playbook ops/backup.yml
          f=$(ls out/kubeshop-*.archive.gz)
          az storage blob upload --auth-mode login --account-name "${{ vars.TFSTATE_SA }}" \
            -c backups -n "$ENVIRONMENT/final-$(basename "$f")" -f "$f" -o none
          echo "Backup final: $ENVIRONMENT/final-$(basename "$f")" >> "$GITHUB_STEP_SUMMARY"

      - name: Terraform destroy
        working-directory: terraform
        run: terraform destroy -input=false -auto-approve -no-color
