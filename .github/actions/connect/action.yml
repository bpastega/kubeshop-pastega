# .github/actions/connect/action.yml
name: connect
description: Login no Azure, outputs do Terraform, SSH temporário, chave e inventário
inputs:
  environment:     { required: true }
  client-id:       { required: true }
  tenant-id:       { required: true }
  subscription-id: { required: true }
  ssh-private-key: { required: true }
  tfstate-rg:      { required: true }
  tfstate-sa:      { required: true }
  tfstate-container: { required: true }
outputs:
  rg:  { value: "${{ steps.tf.outputs.rg }}" }
  nsg: { value: "${{ steps.tf.outputs.nsg }}" }
runs:
  using: composite
  steps:
    - uses: azure/login@v2
      with:
        client-id: ${{ inputs.client-id }}
        tenant-id: ${{ inputs.tenant-id }}
        subscription-id: ${{ inputs.subscription-id }}

    - uses: hashicorp/setup-terraform@v3
      with: { terraform_version: 1.17.2, terraform_wrapper: false }

    - name: Terraform init e outputs
      id: tf
      shell: bash
      working-directory: terraform
      run: |
        terraform init -input=false \
          -backend-config="resource_group_name=${{ inputs.tfstate-rg }}" \
          -backend-config="storage_account_name=${{ inputs.tfstate-sa }}" \
          -backend-config="container_name=${{ inputs.tfstate-container }}" \
          -backend-config="key=kubeshop-${{ inputs.environment }}.tfstate"
        echo "app_ip=$(terraform output -raw app_public_ip)" >> "$GITHUB_OUTPUT"
        echo "rg=$(terraform output -raw resource_group)" >> "$GITHUB_OUTPUT"
        echo "nsg=$(terraform output -raw nsg_app_name)" >> "$GITHUB_OUTPUT"

    - name: Liberar SSH temporário
      shell: bash
      run: |
        RUNNER_IP=$(curl -s https://api.ipify.org)
        az network nsg rule create -g "${{ steps.tf.outputs.rg }}" --nsg-name "${{ steps.tf.outputs.nsg }}" \
          -n "gh-runner-${{ github.run_id }}" --priority 200 --direction Inbound --access Allow \
          --protocol Tcp --source-address-prefixes "$RUNNER_IP/32" --destination-port-ranges 22 -o none
        for i in $(seq 1 30); do nc -z -w 3 "${{ steps.tf.outputs.app_ip }}" 22 && break; sleep 10; done

    - uses: webfactory/ssh-agent@v0.9.0
      with: { ssh-private-key: "${{ inputs.ssh-private-key }}" }

    - name: Ansible e inventário
      shell: bash
      working-directory: ansible
      env:
        APP_IP: ${{ steps.tf.outputs.app_ip }}
      run: |
        pipx install --include-deps ansible
        mkdir -p inventory out ~/.ssh
        # registra a chave do host da VM app: sem isso, o ProxyJump até a VM db pode falhar
        ssh-keyscan -T 10 -H "${APP_IP}" >> ~/.ssh/known_hosts
        cat > inventory/hosts.ini <<EOF
        [app]
        vm-app ansible_host=${APP_IP}
        [db]
        vm-db ansible_host=10.10.2.10 ansible_ssh_common_args='-o ProxyJump=azureuser@${APP_IP} -o StrictHostKeyChecking=accept-new'
        [all:vars]
        ansible_user=azureuser
        EOF
